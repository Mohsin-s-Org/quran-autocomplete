name: Apply undo and inline formatting fix

on:
  push:
    branches:
      - agent/undo-inline-format

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/undo-inline-format
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply source, test, documentation, and version updates
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import json

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f"Missing expected block: {label}")
              return text.replace(old, new, 1)

          path = Path('src/main.ts')
          text = path.read_text()
          text = replace_once(text,
          'export type QuranOutputStyle = "blockquote" | "inline";\n',
          'export type QuranOutputStyle = "blockquote" | "inline";\nexport type InlineEmphasis = "none" | "italic" | "bold";\n',
          'inline emphasis type')
          text = replace_once(text,
          '  outputStyle: QuranOutputStyle;\n  keepTriggerReference: boolean;\n',
          '  outputStyle: QuranOutputStyle;\n  inlineEmphasis: InlineEmphasis;\n  keepTriggerReference: boolean;\n',
          'inline emphasis setting')
          text = replace_once(text,
          '  outputStyle: "blockquote",\n  keepTriggerReference: true,\n',
          '  outputStyle: "blockquote",\n  inlineEmphasis: "italic",\n  keepTriggerReference: true,\n',
          'inline emphasis default')
          text = replace_once(text,
          '  return { startCh: Math.max(0, start), endCh: Math.min(line.length, end) };\n}\n\nexport function formatReference',
          '''  return { startCh: Math.max(0, start), endCh: Math.min(line.length, end) };\n}\n\n/** Build one atomic paragraph replacement so trigger removal and quote insertion undo together. */\nexport function buildBlockquoteParagraphReplacement(\n  paragraphLines: string[],\n  triggerLineIndex: number,\n  triggerStartCh: number,\n  triggerEndCh: number,\n  output: string,\n  keepTriggerReference: boolean,\n): string {\n  const updatedLines = [...paragraphLines];\n  if (!keepTriggerReference) {\n    const sourceLine = updatedLines[triggerLineIndex];\n    if (sourceLine === undefined) {\n      throw new Error("The trigger line is outside the paragraph.");\n    }\n    const removal = getTriggerRemovalRange(sourceLine, triggerStartCh, triggerEndCh);\n    updatedLines[triggerLineIndex] =\n      sourceLine.slice(0, removal.startCh) + sourceLine.slice(removal.endCh);\n  }\n  return `${updatedLines.join("\\n")}\\n\\n${output}`;\n}\n\nexport function formatReference''',
          'atomic blockquote helper')
          old_format = '''export function formatQuranOutput(\n  reference: AyahReference,\n  ayahs: QuoteAyah[],\n  surahName: string,\n  settings: QuranQuoteSettings,\n): string {\n  const citation = `(${buildCitation(reference, surahName, settings)})`;\n  const english = formatEnglishAyahs(ayahs, settings);\n\n  if (settings.outputStyle === "inline") {\n    const englishInline = english.join(" ");\n    if (settings.contentMode === "english-only") {\n      return `${englishInline} ${citation}`;\n    }\n\n    const arabicInline = formatArabicAyahs(ayahs, settings).join(" ");\n    return `<span class="quran-quote-arabic-inline" dir="rtl" lang="ar">${arabicInline}</span> — ${englishInline} ${citation}`;\n  }\n\n  const lines: string[] = [];'''
          new_format = '''export function applyInlineEmphasis(value: string, emphasis: InlineEmphasis): string {\n  if (emphasis === "none") {\n    return value;\n  }\n  const tag = emphasis === "bold" ? "strong" : "em";\n  return `<${tag} class="quran-quote-inline-emphasis">${value}</${tag}>`;\n}\n\nexport function formatQuranOutput(\n  reference: AyahReference,\n  ayahs: QuoteAyah[],\n  surahName: string,\n  settings: QuranQuoteSettings,\n): string {\n  const citation = `(${buildCitation(reference, surahName, settings)})`;\n\n  if (settings.outputStyle === "inline") {\n    const showEnglishVerseNumber = settings.includeVerseNumbers && ayahs.length > 1;\n    const englishInline = ayahs\n      .map((ayah) => {\n        const number = showEnglishVerseNumber ? `${ayah.number}. ` : "";\n        return `${number}${escapeHtml(ayah.english.replace(/\\r?\\n/g, " ").trim())}`;\n      })\n      .join(" ");\n    const citationInline = escapeHtml(citation);\n    const inlineOutput =\n      settings.contentMode === "english-only"\n        ? `${englishInline} ${citationInline}`\n        : `<span class="quran-quote-arabic-inline" dir="rtl" lang="ar">${formatArabicAyahs(ayahs, settings).join(" ")}</span> — ${englishInline} ${citationInline}`;\n    return applyInlineEmphasis(inlineOutput, settings.inlineEmphasis);\n  }\n\n  const english = formatEnglishAyahs(ayahs, settings);\n  const lines: string[] = [];'''
          text = replace_once(text, old_format, new_format, 'inline formatter')
          text = replace_once(text,
          '''interface TriggerFingerprint {\n  line: number;\n  startCh: number;\n  endCh: number;\n  matchedText: string;\n}\n''',
          '''interface TriggerFingerprint {\n  line: number;\n  startCh: number;\n  endCh: number;\n  matchedText: string;\n}\n\ninterface UndoGuard {\n  key: string;\n  fingerprint: TriggerFingerprint;\n}\n''',
          'undo guard interface')
          text = replace_once(text,
          '  private readonly suppressAutoInsertUntil = new WeakMap<Editor, number>();\n',
          '  private readonly suppressAutoInsertUntil = new WeakMap<Editor, number>();\n  private readonly undoGuards = new WeakMap<Editor, UndoGuard>();\n',
          'undo guard field')
          old_keydown = '''    this.registerDomEvent(document, "keydown", (event: KeyboardEvent) => {\n      const target = event.target;\n      if (\n        !(target instanceof HTMLElement) ||\n        !target.closest(".cm-editor") ||\n        event.key !== ")" ||\n        event.defaultPrevented ||\n        event.ctrlKey ||\n        event.metaKey ||\n        event.altKey ||\n        !this.settings.autoInsertEnabled\n      ) {\n        return;\n      }\n\n      window.setTimeout(() => {\n        const view = this.app.workspace.getActiveViewOfType(MarkdownView);\n        if (view) {\n          this.queueAutoInsert(view.editor, 0);\n        }\n      }, 0);\n    });\n'''
          new_keydown = '''    this.registerDomEvent(document, "keydown", (event: KeyboardEvent) => {\n      const target = event.target;\n      if (!(target instanceof HTMLElement) || !target.closest(".cm-editor")) {\n        return;\n      }\n      const view = this.app.workspace.getActiveViewOfType(MarkdownView);\n      const isUndo =\n        (event.ctrlKey || event.metaKey) &&\n        !event.altKey &&\n        event.key.toLowerCase() === "z";\n      if (isUndo) {\n        if (view) {\n          this.suppressAutomaticInsertion(view.editor, 1500);\n        }\n        return;\n      }\n      if (\n        event.key !== ")" ||\n        event.defaultPrevented ||\n        event.ctrlKey ||\n        event.metaKey ||\n        event.altKey ||\n        !this.settings.autoInsertEnabled\n      ) {\n        return;\n      }\n      window.setTimeout(() => {\n        if (view) {\n          this.queueAutoInsert(view.editor, 0);\n        }\n      }, 0);\n    });\n\n    this.registerDomEvent(document, "beforeinput", (event: InputEvent) => {\n      const target = event.target;\n      if (\n        !(target instanceof HTMLElement) ||\n        !target.closest(".cm-editor") ||\n        (event.inputType !== "historyUndo" && event.inputType !== "historyRedo")\n      ) {\n        return;\n      }\n      const view = this.app.workspace.getActiveViewOfType(MarkdownView);\n      if (view) {\n        this.suppressAutomaticInsertion(view.editor, 1500);\n      }\n    });\n'''
          text = replace_once(text, old_keydown, new_keydown, 'undo keyboard and input handling')
          text = replace_once(text,
          '''  private queueAutoInsert(editor: Editor, delay: number): void {\n    if (!this.settings.autoInsertEnabled || this.autoInsertInProgress.has(editor)) {\n      return;\n    }\n    if ((this.suppressAutoInsertUntil.get(editor) ?? 0) > Date.now()) {\n      return;\n    }\n\n    const registry = this.registryFor(editor);\n''',
          '''  private suppressAutomaticInsertion(editor: Editor, durationMs: number): void {\n    const existingTimer = this.autoInsertTimers.get(editor);\n    if (existingTimer !== undefined) {\n      window.clearTimeout(existingTimer);\n      this.autoInsertTimers.delete(editor);\n    }\n    this.suppressAutoInsertUntil.set(editor, Date.now() + durationMs);\n  }\n\n  private consumeUndoGuard(editor: Editor): boolean {\n    const guard = this.undoGuards.get(editor);\n    if (!guard) {\n      return false;\n    }\n    const { fingerprint } = guard;\n    if (fingerprint.line >= editor.lineCount()) {\n      return false;\n    }\n    const restored = editor.getRange(\n      { line: fingerprint.line, ch: fingerprint.startCh },\n      { line: fingerprint.line, ch: fingerprint.endCh },\n    );\n    if (restored !== fingerprint.matchedText) {\n      return false;\n    }\n    this.registryFor(editor).complete(guard.key, fingerprint);\n    this.undoGuards.delete(editor);\n    this.suppressAutomaticInsertion(editor, 1000);\n    return true;\n  }\n\n  private queueAutoInsert(editor: Editor, delay: number): void {\n    if (!this.settings.autoInsertEnabled || this.autoInsertInProgress.has(editor)) {\n      return;\n    }\n    if (this.consumeUndoGuard(editor)) {\n      return;\n    }\n    if ((this.suppressAutoInsertUntil.get(editor) ?? 0) > Date.now()) {\n      return;\n    }\n\n    const registry = this.registryFor(editor);\n''',
          'undo guard consumption')
          text = replace_once(text,
          '''    const inserted = await this.performAutomaticInsertion(editor, match, fingerprint);\n    if (inserted && this.settings.outputStyle === "blockquote" && this.settings.keepTriggerReference) {\n      registry.complete(key, fingerprint);\n    } else {\n      // Inline output and removed triggers no longer exist at the source range.\n      registry.cancel(key);\n    }\n''',
          '''    const inserted = await this.performAutomaticInsertion(editor, match, fingerprint);\n    if (!inserted) {\n      registry.cancel(key);\n      return;\n    }\n    if (this.settings.outputStyle === "blockquote" && this.settings.keepTriggerReference) {\n      registry.complete(key, fingerprint);\n    } else {\n      registry.cancel(key);\n      this.undoGuards.set(editor, { key, fingerprint });\n    }\n''',
          'record undo guard')
          old_block_insert = '''      const paragraphEndLine = this.findParagraphEndLine(editor, fingerprint.line);\n      const paragraphEndCh = editor.getLine(paragraphEndLine).length;\n      editor.replaceRange(\n        `\\n\\n${output}`,\n        { line: paragraphEndLine, ch: paragraphEndCh },\n        undefined,\n        "quran-quote-auto",\n      );\n\n      if (!this.settings.keepTriggerReference) {\n        const currentSourceLine = editor.getLine(fingerprint.line);\n        const removal = getTriggerRemovalRange(\n          currentSourceLine,\n          fingerprint.startCh,\n          fingerprint.endCh,\n        );\n        editor.replaceRange(\n          "",\n          { line: fingerprint.line, ch: removal.startCh },\n          { line: fingerprint.line, ch: removal.endCh },\n          "quran-quote-auto",\n        );\n      }\n\n      return true;\n'''
          new_block_insert = '''      const paragraphStartLine = this.findParagraphStartLine(editor, fingerprint.line);\n      const paragraphEndLine = this.findParagraphEndLine(editor, fingerprint.line);\n      const paragraphLines: string[] = [];\n      for (let line = paragraphStartLine; line <= paragraphEndLine; line += 1) {\n        paragraphLines.push(editor.getLine(line));\n      }\n      const replacement = buildBlockquoteParagraphReplacement(\n        paragraphLines,\n        fingerprint.line - paragraphStartLine,\n        fingerprint.startCh,\n        fingerprint.endCh,\n        output,\n        this.settings.keepTriggerReference,\n      );\n      editor.replaceRange(\n        replacement,\n        { line: paragraphStartLine, ch: 0 },\n        { line: paragraphEndLine, ch: editor.getLine(paragraphEndLine).length },\n        "quran-quote-auto",\n      );\n      return true;\n'''
          text = replace_once(text, old_block_insert, new_block_insert, 'atomic blockquote insertion')
          text = replace_once(text,
          '''  private findParagraphEndLine(editor: Editor, startLine: number): number {\n''',
          '''  private findParagraphStartLine(editor: Editor, startLine: number): number {\n    let paragraphStartLine = startLine;\n    while (paragraphStartLine > 0) {\n      const previousLine = editor.getLine(paragraphStartLine - 1);\n      if (previousLine.trim() === "") {\n        break;\n      }\n      paragraphStartLine -= 1;\n    }\n    return paragraphStartLine;\n  }\n\n  private findParagraphEndLine(editor: Editor, startLine: number): number {\n''',
          'paragraph start helper')
          text = replace_once(text,
          '''    } else {\n      new Setting(containerEl)\n        .setName("Inline trigger replacement")\n        .setDesc("Inline layout replaces the typed parenthesized trigger with the generated passage and its formatted Qur’an reference.");\n    }\n\n    new Setting(containerEl)\n''',
          '''    } else {\n      new Setting(containerEl)\n        .setName("Inline trigger replacement")\n        .setDesc("Inline layout replaces the typed parenthesized trigger with the generated passage and its formatted Qur’an reference.");\n      new Setting(containerEl)\n        .setName("Inline emphasis")\n        .setDesc("Make inline passages stand out using plain text, italics, or bold text.")\n        .addDropdown((dropdown) => {\n          dropdown.addOption("none", "Plain");\n          dropdown.addOption("italic", "Italic");\n          dropdown.addOption("bold", "Bold");\n          dropdown.setValue(this.plugin.settings.inlineEmphasis);\n          dropdown.onChange(async (value: string) => {\n            this.plugin.settings.inlineEmphasis = value as InlineEmphasis;\n            await this.plugin.saveSettings();\n          });\n        });\n    }\n\n    new Setting(containerEl)\n''',
          'inline emphasis setting UI')
          path.write_text(text)

          tests_path = Path('tests/reference.test.cjs')
          tests = tests_path.read_text()
          tests = replace_once(tests,
          '''  AutomaticTriggerRegistry,\n  parseAyahReference,\n''',
          '''  AutomaticTriggerRegistry,\n  applyInlineEmphasis,\n  buildBlockquoteParagraphReplacement,\n  parseAyahReference,\n''',
          'test imports')
          tests = replace_once(tests,
          '  outputStyle: "blockquote",\n  keepTriggerReference: true,\n',
          '  outputStyle: "blockquote",\n  inlineEmphasis: "italic",\n  keepTriggerReference: true,\n',
          'test settings')
          old_inline_tests = '''const englishInline = formatQuranOutput(reference, ayahs, "Taa-Haa", {\n  ...baseSettings,\n  contentMode: "english-only",\n  outputStyle: "inline",\n});\nassert.equal(\n  englishInline,\n  "**12.** English one **13.** English two (Qur’an 20:12–13 · Taa-Haa · Sahih International)",\n);\n\nconst arabicEnglishInline = formatQuranOutput(reference, ayahs, "Taa-Haa", {\n  ...baseSettings,\n  outputStyle: "inline",\n});\nassert.match(arabicEnglishInline, /^<span class="quran-quote-arabic-inline"/);\nassert.match(arabicEnglishInline, /ARABIC ONE/);\nassert.match(arabicEnglishInline, /— \\*\\*12\\.\\*\\* English one/);\nassert.match(arabicEnglishInline, /\\(Qur’an 20:12–13 · Taa-Haa · Sahih International\\)$/);\n'''
          new_inline_tests = '''const englishInline = formatQuranOutput(reference, ayahs, "Taa-Haa", {\n  ...baseSettings,\n  contentMode: "english-only",\n  outputStyle: "inline",\n});\nassert.equal(\n  englishInline,\n  '<em class="quran-quote-inline-emphasis">12. English one 13. English two (Qur’an 20:12–13 · Taa-Haa · Sahih International)</em>',\n);\n\nconst arabicEnglishInline = formatQuranOutput(reference, ayahs, "Taa-Haa", {\n  ...baseSettings,\n  outputStyle: "inline",\n});\nassert.match(arabicEnglishInline, /^<em class="quran-quote-inline-emphasis"><span class="quran-quote-arabic-inline"/);\nassert.match(arabicEnglishInline, /ARABIC ONE/);\nassert.match(arabicEnglishInline, /— 12\\. English one/);\nassert.match(arabicEnglishInline, /\\(Qur’an 20:12–13 · Taa-Haa · Sahih International\\)<\\/em>$/);\n\nassert.equal(applyInlineEmphasis("passage", "none"), "passage");\nassert.equal(applyInlineEmphasis("passage", "italic"), '<em class="quran-quote-inline-emphasis">passage</em>');\nassert.equal(applyInlineEmphasis("passage", "bold"), '<strong class="quran-quote-inline-emphasis">passage</strong>');\n\nconst atomicReplacement = buildBlockquoteParagraphReplacement(\n  ["This matters (13:14)."], 0, 13, 20, "> translated passage", false,\n);\nassert.equal(atomicReplacement, "This matters.\\n\\n> translated passage");\nassert.equal(\n  buildBlockquoteParagraphReplacement(\n    ["First line", "This matters (13:14)."], 1, 13, 20, "> translated passage", true,\n  ),\n  "First line\\nThis matters (13:14).\\n\\n> translated passage",\n);\n'''
          tests = replace_once(tests, old_inline_tests, new_inline_tests, 'inline and atomic tests')
          tests_path.write_text(tests)

          readme_path = Path('README.md')
          readme = readme_path.read_text()
          readme = readme.replace('quran-autocomplete-0.5.0.zip', 'quran-autocomplete-0.5.1.zip')
          readme = replace_once(readme,
          '''### After: inline\n\nWith inline layout enabled, the parenthesized trigger is replaced directly:\n''',
          '''### After: inline\n\nWith inline layout enabled, the parenthesized trigger is replaced directly. Inline text can be plain, italic, or bold; italic is the default:\n''',
          'readme inline demo')
          readme = replace_once(readme,
          '''- Layout: quote block beneath the paragraph, or inline replacement.\n- Keep or remove the original typed reference when using quote-block layout.\n''',
          '''- Layout: quote block beneath the paragraph, or inline replacement.\n- Inline emphasis: plain, italic, or bold.\n- Keep or remove the original typed reference when using quote-block layout.\n- Undo removes the generated passage in one step and does not immediately insert it again.\n''',
          'readme settings and undo')
          readme_path.write_text(readme)

          manifest_path = Path('manifest.json')
          manifest = json.loads(manifest_path.read_text())
          manifest['version'] = '0.5.1'
          manifest_path.write_text(json.dumps(manifest, indent=2) + '\n')
          package_path = Path('package.json')
          package = json.loads(package_path.read_text())
          package['version'] = '0.5.1'
          package_path.write_text(json.dumps(package, indent=2) + '\n')
          lock_path = Path('package-lock.json')
          lock = json.loads(lock_path.read_text())
          lock['version'] = '0.5.1'
          lock['packages']['']['version'] = '0.5.1'
          lock_path.write_text(json.dumps(lock, indent=2) + '\n')
          versions_path = Path('versions.json')
          versions = json.loads(versions_path.read_text())
          versions['0.5.1'] = manifest['minAppVersion']
          versions_path.write_text(json.dumps(versions, indent=2) + '\n')
          PY
          npm ci
          npm run check
          node --check main.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.ts tests/reference.test.cjs README.md manifest.json package.json package-lock.json versions.json
          git commit -m "Fix undo and add inline emphasis"
          git push
