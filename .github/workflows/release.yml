name: Release

on:
  push:
    tags:
      - "*"

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: self-hosted
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Build and test
        run: npm run check

      - name: Check generated JavaScript syntax
        run: node --check main.js

      - name: Validate release version and tag
        shell: bash
        run: |
          MANIFEST_VERSION=$(node -p "require('./manifest.json').version")
          PACKAGE_VERSION=$(node -p "require('./package.json').version")

          if [ "$MANIFEST_VERSION" != "$PACKAGE_VERSION" ]; then
            echo "manifest.json and package.json versions do not match" >&2
            exit 1
          fi

          if [ "$GITHUB_REF_NAME" != "$MANIFEST_VERSION" ]; then
            echo "Release tag must exactly match manifest.json version" >&2
            exit 1
          fi

          echo "VERSION=$MANIFEST_VERSION" >> "$GITHUB_ENV"

      - name: Attest main.js
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: main.js

      - name: Attest manifest.json
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: manifest.json

      - name: Attest styles.css
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: styles.css

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          NOTES=$(cat <<'EOF'
          Quran Autocomplete for Obsidian.

          Download `main.js`, `manifest.json`, and `styles.css` for manual installation. Obsidian uses these same three files for Community Plugins installation.
          EOF
          )

          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release edit "$VERSION" --notes "$NOTES"
          else
            gh release create "$VERSION" \
              --title "$VERSION" \
              --notes "$NOTES" \
              --verify-tag
          fi

          gh release upload "$VERSION" \
            main.js \
            manifest.json \
            styles.css \
            --clobber
