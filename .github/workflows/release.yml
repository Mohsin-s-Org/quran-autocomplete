name: Release

on:
  push:
    branches: [main]
    paths:
      - manifest.json
      - package.json
      - package-lock.json
      - src/**
      - styles.css
      - scripts/**
      - tsconfig.json
      - tests/**
      - test-stubs/**
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: node --check main.js
      - name: Validate versions
        shell: bash
        run: |
          MANIFEST_VERSION=$(node -p "require('./manifest.json').version")
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          if [ "$MANIFEST_VERSION" != "$PACKAGE_VERSION" ]; then
            echo "manifest.json and package.json versions do not match" >&2
            exit 1
          fi
          echo "VERSION=$MANIFEST_VERSION" >> "$GITHUB_ENV"
      - name: Attest main.js
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: main.js
      - name: Attest manifest.json
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: manifest.json
      - name: Attest styles.css
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: styles.css
      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          NOTES=$(cat <<'EOF'
          Quran Autocomplete for Obsidian.

          Download `main.js`, `manifest.json`, and `styles.css` for manual installation. Obsidian uses these same three files for Community Plugins installation.
          EOF
          )

          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release edit "$VERSION" --notes "$NOTES"
          else
            gh release create "$VERSION" \
              --target "$GITHUB_SHA" \
              --title "$VERSION" \
              --notes "$NOTES"
          fi

          gh release upload "$VERSION" \
            main.js \
            manifest.json \
            styles.css \
            --clobber
