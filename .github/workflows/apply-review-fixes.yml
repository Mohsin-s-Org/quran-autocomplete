name: Apply review fixes

on:
  push:
    branches: [agent/review-cleanup-trigger-removal]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/review-cleanup-trigger-removal
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: python3 .github/scripts/apply_review_fixes.py
      - run: npm install
      - run: npm run check
      - name: Commit generated fixes
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Fix trigger removal and community review findings"
          git push
