name: Release

on:
  push:
    branches: [main]
    paths:
      - manifest.json
      - package.json
      - package-lock.json
      - src/**
      - styles.css
      - scripts/**
      - tsconfig.json
      - types/**
      - tests/**
      - test-stubs/**
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Validate versions
        shell: bash
        run: |
          MANIFEST_VERSION=$(node -p "require('./manifest.json').version")
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          if [ "$MANIFEST_VERSION" != "$PACKAGE_VERSION" ]; then
            echo "manifest.json and package.json versions do not match" >&2
            exit 1
          fi
          echo "VERSION=$MANIFEST_VERSION" >> "$GITHUB_ENV"
      - name: Build ready-to-install ZIP
        shell: bash
        run: |
          PLUGIN_ID=$(node -p "require('./manifest.json').id")
          ARCHIVE="quran-autocomplete-$VERSION.zip"
          mkdir -p "release/$PLUGIN_ID"
          cp main.js manifest.json styles.css "release/$PLUGIN_ID/"
          (
            cd release
            zip -r "../$ARCHIVE" "$PLUGIN_ID"
          )
          echo "ARCHIVE=$ARCHIVE" >> "$GITHUB_ENV"
      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          NOTES=$(cat <<'EOF'
          Quran Autocomplete for Obsidian.

          For the easiest manual installation, download the versioned ZIP asset, extract it, and copy the included `quran-quote` folder into your vault's `.obsidian/plugins/` folder.

          Obsidian's Community Plugins installer uses the individual `main.js`, `manifest.json`, and `styles.css` assets.
          EOF
          )

          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release edit "$VERSION" --notes "$NOTES"
          else
            gh release create "$VERSION" \
              --target "$GITHUB_SHA" \
              --title "$VERSION" \
              --notes "$NOTES"
          fi

          gh release upload "$VERSION" \
            main.js \
            manifest.json \
            styles.css \
            "$ARCHIVE" \
            --clobber
