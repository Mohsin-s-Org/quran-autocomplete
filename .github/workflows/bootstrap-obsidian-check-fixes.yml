name: Bootstrap Obsidian check fixes

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/obsidian-check-warnings'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/obsidian-check-warnings
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply final fixes
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          const sourcePath = 'src/main.ts';
          let source = fs.readFileSync(sourcePath, 'utf8');
          const withoutSetting = '  PluginSettingTab,\n  SettingDefinitionItem,';
          const withSetting = '  PluginSettingTab,\n  Setting,\n  SettingDefinitionItem,';
          if (source.includes(withoutSetting)) {
            source = source.replace(withoutSetting, withSetting);
          }
          if (!source.includes(withSetting)) {
            throw new Error('The Obsidian Setting import could not be verified.');
          }
          if (source.includes('.trimEnd()')) {
            throw new Error('The ES2019-only trimEnd call is still present.');
          }
          if (/\n\s*display\(\): void \{/.test(source) || source.includes('this.display()')) {
            throw new Error('The deprecated settings display implementation is still present.');
          }
          fs.writeFileSync(sourcePath, source);

          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          pkg.version = '0.5.3';
          fs.writeFileSync('package.json', `${JSON.stringify(pkg, null, 2)}\n`);

          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          lock.version = '0.5.3';
          lock.packages[''].version = '0.5.3';
          fs.writeFileSync('package-lock.json', `${JSON.stringify(lock, null, 2)}\n`);

          const manifest = JSON.parse(fs.readFileSync('manifest.json', 'utf8'));
          manifest.version = '0.5.3';
          manifest.minAppVersion = '1.13.0';
          fs.writeFileSync('manifest.json', `${JSON.stringify(manifest, null, 2)}\n`);

          const versions = JSON.parse(fs.readFileSync('versions.json', 'utf8'));
          versions['0.5.3'] = '1.13.0';
          fs.writeFileSync('versions.json', `${JSON.stringify(versions, null, 2)}\n`);

          fs.rmSync('.github/obsidian-fix-trigger', { force: true });
          NODE

      - run: npm ci
      - run: npm run check
      - run: node --check main.js

      - name: Commit verified changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No remaining changes."
          else
            git commit -m "Complete Obsidian warning fixes"
            git push origin HEAD:fix/obsidian-check-warnings
          fi
