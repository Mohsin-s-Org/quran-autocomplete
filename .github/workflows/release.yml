name: Release

on:
  push:
    branches: [main]
    paths:
      - manifest.json
      - package.json
      - package-lock.json
      - src/**
      - styles.css
      - scripts/**
      - tsconfig.json
      - types/**
      - tests/**
      - test-stubs/**
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Validate versions
        shell: bash
        run: |
          MANIFEST_VERSION=$(node -p "require('./manifest.json').version")
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          if [ "$MANIFEST_VERSION" != "$PACKAGE_VERSION" ]; then
            echo "manifest.json and package.json versions do not match" >&2
            exit 1
          fi
          echo "VERSION=$MANIFEST_VERSION" >> "$GITHUB_ENV"
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "Release $VERSION already exists; nothing to do."
            exit 0
          fi
          gh release create "$VERSION" \
            --target "$GITHUB_SHA" \
            --title "$VERSION" \
            --notes "Initial community release of Quran Autocomplete." \
            main.js manifest.json styles.css
