name: Bootstrap review fixes

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/bootstrap-review-fixes.yml

permissions:
  contents: write

jobs:
  patch-feature-branch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/review-cleanup-trigger-removal
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: python3 .github/scripts/apply_review_fixes.py
      - run: npm install
      - run: npm run check
      - name: Commit validated fixes to feature branch
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Fix trigger removal and community review findings"
          git push origin HEAD:agent/review-cleanup-trigger-removal
