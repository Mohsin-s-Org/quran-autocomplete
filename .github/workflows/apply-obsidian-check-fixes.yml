name: Apply Obsidian check fixes

on:
  push:
    branches:
      - fix/obsidian-check-warnings

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply source and tooling updates
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          const sourcePath = 'src/main.ts';
          let source = fs.readFileSync(sourcePath, 'utf8');

          const unsupportedTrim = '  const paragraph = updatedLines.join("\\n").trimEnd();';
          const safeTrim = '  const paragraph = updatedLines.join("\\n").replace(/[\\t\\n\\r ]+$/u, "");';
          if (source.includes(unsupportedTrim)) {
            source = source.replace(unsupportedTrim, safeTrim);
          } else if (!source.includes(safeTrim)) {
            throw new Error('Could not locate the paragraph trailing-whitespace cleanup.');
          }

          const visibilityUpdates = [
            [
              '        desc: "Type (13:14) or (20:12-13) anywhere in a sentence or paragraph.",\n        control: { type: "toggle" as const, key: "detectParenthesizedReference" },',
              '        desc: "Type (13:14) or (20:12-13) anywhere in a sentence or paragraph.",\n        visible: () => this.plugin.settings.autoInsertEnabled,\n        control: { type: "toggle" as const, key: "detectParenthesizedReference" },',
            ],
            [
              '        desc: "Keep the original (13:14) in the paragraph. Disabled by default.",\n        control: { type: "toggle" as const, key: "keepTriggerReference" },',
              '        desc: "Keep the original (13:14) in the paragraph. Disabled by default.",\n        visible: () => this.plugin.settings.outputStyle === "blockquote",\n        control: { type: "toggle" as const, key: "keepTriggerReference" },',
            ],
            [
              '      {\n        name: "Inline emphasis",\n        desc: "Make inline passages plain, italic, or bold.",',
              '      {\n        name: "Inline trigger replacement",\n        desc: "Inline layout replaces the typed parenthesized trigger with the generated passage and its formatted Quran reference.",\n        visible: () => this.plugin.settings.outputStyle === "inline",\n      },\n      {\n        name: "Inline emphasis",\n        desc: "Make inline passages plain, italic, or bold.",\n        visible: () => this.plugin.settings.outputStyle === "inline",',
            ],
          ];

          for (const [before, after] of visibilityUpdates) {
            if (source.includes(before)) {
              source = source.replace(before, after);
            } else if (!source.includes(after)) {
              throw new Error(`Could not apply settings definition update: ${before.slice(0, 70)}`);
            }
          }

          const displayStart = source.indexOf('\n  display(): void {\n');
          if (displayStart !== -1) {
            const classEnd = source.lastIndexOf('\n}');
            if (classEnd <= displayStart) {
              throw new Error('Could not locate the settings tab class boundary.');
            }
            const declarativePersistence = `

  override async setControlValue(key: string, value: unknown): Promise<void> {
    await super.setControlValue(key, value);
    if (key === "autoInsertEnabled" || key === "outputStyle") {
      this.update();
    }
  }`;
            source = source.slice(0, displayStart) + declarativePersistence + source.slice(classEnd);
          } else if (!source.includes('override async setControlValue(key: string, value: unknown): Promise<void>')) {
            throw new Error('Could not locate the deprecated display method.');
          }

          source = source.replace(
            '  getSettingDefinitions(): SettingDefinitionItem[] {',
            '  override getSettingDefinitions(): SettingDefinitionItem[] {',
          );
          fs.writeFileSync(sourcePath, source);

          const packagePath = 'package.json';
          const pkg = JSON.parse(fs.readFileSync(packagePath, 'utf8'));
          pkg.version = '0.5.3';
          pkg.scripts.lint = 'eslint .';
          pkg.scripts.check = 'npm run lint && npm run build && npm test';
          pkg.devDependencies = {
            ...pkg.devDependencies,
            '@eslint/js': '^9.39.4',
            eslint: '^9.39.4',
            'eslint-plugin-obsidianmd': '^0.4.0',
            globals: '^17.6.0',
            jiti: '^2.6.1',
            'typescript-eslint': '^8.59.1',
          };
          fs.writeFileSync(packagePath, `${JSON.stringify(pkg, null, 2)}\n`);

          const manifestPath = 'manifest.json';
          const manifest = JSON.parse(fs.readFileSync(manifestPath, 'utf8'));
          manifest.version = '0.5.3';
          manifest.minAppVersion = '1.13.0';
          fs.writeFileSync(manifestPath, `${JSON.stringify(manifest, null, 2)}\n`);

          const versionsPath = 'versions.json';
          const versions = JSON.parse(fs.readFileSync(versionsPath, 'utf8'));
          versions['0.5.3'] = '1.13.0';
          fs.writeFileSync(versionsPath, `${JSON.stringify(versions, null, 2)}\n`);

          fs.writeFileSync(
            'eslint.config.mts',
            `import obsidianmd from "eslint-plugin-obsidianmd";
import globals from "globals";
import { defineConfig, globalIgnores } from "eslint/config";

export default defineConfig(
  globalIgnores([
    "node_modules",
    "build",
    "main.js",
    "scripts",
    "tests",
    "package.json",
    "package-lock.json",
    "tsconfig.json",
    "versions.json",
  ]),
  {
    languageOptions: {
      globals: {
        ...globals.browser,
      },
      parserOptions: {
        projectService: {
          allowDefaultProject: ["eslint.config.mts", "manifest.json"],
        },
        tsconfigRootDir: import.meta.dirname,
        extraFileExtensions: [".json"],
      },
    },
  },
  ...obsidianmd.configs.recommended,
);
`,
          );
          NODE

          npm install
          rm .github/workflows/apply-obsidian-check-fixes.yml

      - name: Commit applied changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes to commit."
          else
            git commit -m "Fix Obsidian check warnings"
            git push origin HEAD:fix/obsidian-check-warnings
          fi

      - name: Run Obsidian lint, build, and tests
        run: npm run check
